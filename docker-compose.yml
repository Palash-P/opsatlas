services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: opsatlas
      POSTGRES_USER: opsatlas
      POSTGRES_PASSWORD: opsatlas_dev_password
    ports:
      - "5433:5432"
    volumes:
      - opsatlas_postgres_data:/var/lib/postgresql/data
      - ./sql/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsatlas -d opsatlas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  opsatlas_postgres_data:
