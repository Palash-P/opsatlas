services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsatlas}
      POSTGRES_USER: ${POSTGRES_USER:-opsatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsatlas_dev_password}
    ports:
      # Host port is configurable; PostgreSQL always listens on 5432 inside the
      # Compose network and containers connect to postgres:5432. The default
      # bind address is loopback so a local datastore is never exposed on the
      # network. Set POSTGRES_BIND_ADDRESS only for controlled remote access.
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - opsatlas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-opsatlas} -d $${POSTGRES_DB:-opsatlas}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - app.db.migrations
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opsatlas}:${POSTGRES_PASSWORD:-opsatlas_dev_password}@postgres:5432/${POSTGRES_DB:-opsatlas}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m

  redis:
    image: redis:7.4.2-alpine
    ports:
      # Loopback-only by default; Redis has no authentication in this local
      # Compose file and must not be reachable from other hosts.
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
    ports:
      # Loopback-only by default. Production ingress should terminate TLS in
      # front of this service; do not publish the API directly on 0.0.0.0.
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opsatlas}:${POSTGRES_PASSWORD:-opsatlas_dev_password}@postgres:5432/${POSTGRES_DB:-opsatlas}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_TASK_DEFAULT_QUEUE: ${CELERY_TASK_DEFAULT_QUEUE:-ingestion}
      CELERY_RECONCILIATION_QUEUE: ${CELERY_RECONCILIATION_QUEUE:-reconciliation}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-1800}
      CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-1860}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-2400}
      # Containers cannot reach the host through loopback. .env.example keeps
      # the host-run EMBEDDING_URL separate and sets CONTAINER_EMBEDDING_URL to
      # the host-gateway alias, so copying the example works in both modes.
      EMBEDDING_URL: ${CONTAINER_EMBEDDING_URL:-http://host.docker.internal:8091}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-10}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-1}
      EMBEDDING_RETRY_BACKOFF_SECONDS: ${EMBEDDING_RETRY_BACKOFF_SECONDS:-0.2}
      INGESTION_TASK_MAX_RETRIES: ${INGESTION_TASK_MAX_RETRIES:-3}
      INGESTION_TASK_RETRY_BACKOFF_SECONDS: ${INGESTION_TASK_RETRY_BACKOFF_SECONDS:-5}
      INGESTION_TASK_RETRY_BACKOFF_MAX_SECONDS: ${INGESTION_TASK_RETRY_BACKOFF_MAX_SECONDS:-120}
      INGESTION_TASK_UNEXPECTED_MAX_RETRIES: ${INGESTION_TASK_UNEXPECTED_MAX_RETRIES:-1}
      INGESTION_EXECUTION_LEASE_SECONDS: ${INGESTION_EXECUTION_LEASE_SECONDS:-300}
      INGESTION_RECONCILE_BATCH_SIZE: ${INGESTION_RECONCILE_BATCH_SIZE:-50}
      INGESTION_RECONCILE_DISPATCH_LEASE_SECONDS: ${INGESTION_RECONCILE_DISPATCH_LEASE_SECONDS:-300}
      INGESTION_RECONCILE_DISPATCH_BACKOFF_SECONDS: ${INGESTION_RECONCILE_DISPATCH_BACKOFF_SECONDS:-15}
      INGESTION_RECONCILE_DISPATCH_BACKOFF_MAX_SECONDS: ${INGESTION_RECONCILE_DISPATCH_BACKOFF_MAX_SECONDS:-300}
      INGESTION_RECONCILE_TRANSIENT_GRACE_SECONDS: ${INGESTION_RECONCILE_TRANSIENT_GRACE_SECONDS:-300}
      AUTH_TOKENS: ${AUTH_TOKENS:-{}}
      AUTH_LOG_TENANT_SALT: ${AUTH_LOG_TENANT_SALT:-opsatlas-local-observability-salt}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-240}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_REDIS_KEY_PREFIX: ${RATE_LIMIT_REDIS_KEY_PREFIX:-opsatlas:ratelimit}
      RATE_LIMIT_REDIS_TIMEOUT_SECONDS: ${RATE_LIMIT_REDIS_TIMEOUT_SECONDS:-0.25}
      RATE_LIMIT_REDIS_FALLBACK_TO_LOCAL: ${RATE_LIMIT_REDIS_FALLBACK_TO_LOCAL:-true}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-16}
      CONCURRENCY_ACQUIRE_TIMEOUT_SECONDS: ${CONCURRENCY_ACQUIRE_TIMEOUT_SECONDS:-0.25}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      SCHEMA_VALIDATION_CACHE_SECONDS: ${SCHEMA_VALIDATION_CACHE_SECONDS:-30}
      LLM_PROVIDER: ${LLM_PROVIDER:-extractive}
      LLM_MODEL: ${LLM_MODEL:-extractive-local-v1}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.0}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-700}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_RETRY_BACKOFF_SECONDS: ${LLM_RETRY_BACKOFF_SECONDS:-0.25}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_PATH: ${LLM_API_PATH:-/chat/completions}
      ANSWER_CONTEXT_TOKEN_BUDGET: ${ANSWER_CONTEXT_TOKEN_BUDGET:-4000}
      ANSWER_MAX_EVIDENCE: ${ANSWER_MAX_EVIDENCE:-8}
      ANSWER_CITATION_EXCERPT_CHARS: ${ANSWER_CITATION_EXCERPT_CHARS:-600}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - celery
      - -A
      - app.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
      - --queues=${CELERY_TASK_DEFAULT_QUEUE:-ingestion}
      - --hostname=ingestion@%h
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opsatlas}:${POSTGRES_PASSWORD:-opsatlas_dev_password}@postgres:5432/${POSTGRES_DB:-opsatlas}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_TASK_DEFAULT_QUEUE: ${CELERY_TASK_DEFAULT_QUEUE:-ingestion}
      CELERY_RECONCILIATION_QUEUE: ${CELERY_RECONCILIATION_QUEUE:-reconciliation}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-1800}
      CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-1860}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-2400}
      EMBEDDING_URL: ${CONTAINER_EMBEDDING_URL:-http://host.docker.internal:8091}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-10}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-1}
      EMBEDDING_RETRY_BACKOFF_SECONDS: ${EMBEDDING_RETRY_BACKOFF_SECONDS:-0.2}
      INGESTION_TASK_MAX_RETRIES: ${INGESTION_TASK_MAX_RETRIES:-3}
      INGESTION_TASK_RETRY_BACKOFF_SECONDS: ${INGESTION_TASK_RETRY_BACKOFF_SECONDS:-5}
      INGESTION_TASK_RETRY_BACKOFF_MAX_SECONDS: ${INGESTION_TASK_RETRY_BACKOFF_MAX_SECONDS:-120}
      INGESTION_TASK_UNEXPECTED_MAX_RETRIES: ${INGESTION_TASK_UNEXPECTED_MAX_RETRIES:-1}
      INGESTION_EXECUTION_LEASE_SECONDS: ${INGESTION_EXECUTION_LEASE_SECONDS:-300}
      INGESTION_RECONCILE_BATCH_SIZE: ${INGESTION_RECONCILE_BATCH_SIZE:-50}
      INGESTION_RECONCILE_DISPATCH_LEASE_SECONDS: ${INGESTION_RECONCILE_DISPATCH_LEASE_SECONDS:-300}
      INGESTION_RECONCILE_DISPATCH_BACKOFF_SECONDS: ${INGESTION_RECONCILE_DISPATCH_BACKOFF_SECONDS:-15}
      INGESTION_RECONCILE_DISPATCH_BACKOFF_MAX_SECONDS: ${INGESTION_RECONCILE_DISPATCH_BACKOFF_MAX_SECONDS:-300}
      INGESTION_RECONCILE_TRANSIENT_GRACE_SECONDS: ${INGESTION_RECONCILE_TRANSIENT_GRACE_SECONDS:-300}
      AUTH_LOG_TENANT_SALT: ${AUTH_LOG_TENANT_SALT:-opsatlas-local-observability-salt}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.celery_app:celery_app inspect ping --destination ingestion@$(hostname) --timeout 5 2>&1 | grep -q pong && python -m app.db.schema_validation --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  reconciliation-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - celery
      - -A
      - app.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_RECONCILIATION_WORKER_CONCURRENCY:-1}
      - --queues=${CELERY_RECONCILIATION_QUEUE:-reconciliation}
      - --hostname=reconciliation@%h
      - --max-tasks-per-child=1000
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opsatlas}:${POSTGRES_PASSWORD:-opsatlas_dev_password}@postgres:5432/${POSTGRES_DB:-opsatlas}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_TASK_DEFAULT_QUEUE: ${CELERY_TASK_DEFAULT_QUEUE:-ingestion}
      CELERY_RECONCILIATION_QUEUE: ${CELERY_RECONCILIATION_QUEUE:-reconciliation}
      CELERY_RECONCILIATION_WORKER_CONCURRENCY: ${CELERY_RECONCILIATION_WORKER_CONCURRENCY:-1}
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-1800}
      CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-1860}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-2400}
      INGESTION_EXECUTION_LEASE_SECONDS: ${INGESTION_EXECUTION_LEASE_SECONDS:-300}
      INGESTION_RECONCILE_BATCH_SIZE: ${INGESTION_RECONCILE_BATCH_SIZE:-50}
      INGESTION_RECONCILE_DISPATCH_LEASE_SECONDS: ${INGESTION_RECONCILE_DISPATCH_LEASE_SECONDS:-300}
      INGESTION_RECONCILE_DISPATCH_BACKOFF_SECONDS: ${INGESTION_RECONCILE_DISPATCH_BACKOFF_SECONDS:-15}
      INGESTION_RECONCILE_DISPATCH_BACKOFF_MAX_SECONDS: ${INGESTION_RECONCILE_DISPATCH_BACKOFF_MAX_SECONDS:-300}
      INGESTION_RECONCILE_TRANSIENT_GRACE_SECONDS: ${INGESTION_RECONCILE_TRANSIENT_GRACE_SECONDS:-300}
      AUTH_LOG_TENANT_SALT: ${AUTH_LOG_TENANT_SALT:-opsatlas-local-observability-salt}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.celery_app:celery_app inspect ping --destination reconciliation@$(hostname) --timeout 5 2>&1 | grep -q pong && python -m app.db.schema_validation --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - celery
      - -A
      - app.celery_app:celery_app
      - beat
      - --loglevel=INFO
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opsatlas}:${POSTGRES_PASSWORD:-opsatlas_dev_password}@postgres:5432/${POSTGRES_DB:-opsatlas}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_TASK_DEFAULT_QUEUE: ${CELERY_TASK_DEFAULT_QUEUE:-ingestion}
      CELERY_RECONCILIATION_QUEUE: ${CELERY_RECONCILIATION_QUEUE:-reconciliation}
      INGESTION_RECONCILE_ENABLED: ${INGESTION_RECONCILE_ENABLED:-true}
      INGESTION_RECONCILE_INTERVAL_SECONDS: ${INGESTION_RECONCILE_INTERVAL_SECONDS:-60}
      INGESTION_RECONCILE_BATCH_SIZE: ${INGESTION_RECONCILE_BATCH_SIZE:-50}
      INGESTION_RECONCILE_DISPATCH_LEASE_SECONDS: ${INGESTION_RECONCILE_DISPATCH_LEASE_SECONDS:-300}
      INGESTION_RECONCILE_DISPATCH_BACKOFF_SECONDS: ${INGESTION_RECONCILE_DISPATCH_BACKOFF_SECONDS:-15}
      INGESTION_RECONCILE_DISPATCH_BACKOFF_MAX_SECONDS: ${INGESTION_RECONCILE_DISPATCH_BACKOFF_MAX_SECONDS:-300}
      INGESTION_RECONCILE_TRANSIENT_GRACE_SECONDS: ${INGESTION_RECONCILE_TRANSIENT_GRACE_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m

volumes:
  opsatlas_postgres_data:
